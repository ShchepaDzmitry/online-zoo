<swiper-container
  [slidesPerView]="4"
  [spaceBetween]="20"
  [navigation]="true"
  [loop]="true"
  class="carousel-container"
>
@for (animal of animalService.animals(); track animal.id) {
    <swiper-slide>
        <app-carousel-card [animal]="animal"></app-carousel-card>
    </swiper-slide>
}
</swiper-container>
