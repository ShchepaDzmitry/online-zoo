<div class="feedback__card">
  <img src="/assets/quotes.png" alt="icon quote" />
  <p class="subheader">
    <span>{{ card().city }}</span
    >, <span>{{ card().month }}</span> <span>{{ card().year }}</span>
  </p>
  <p>{{ card().text }}</p>
  <p class="feedback__card--user">{{ card().name }}</p>
</div>
